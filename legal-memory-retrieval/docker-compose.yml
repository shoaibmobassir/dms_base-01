services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal_memory
    ports:
      - "55432:5432"
    volumes:
      - legal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_memory"]
      interval: 3s
      timeout: 5s
      retries: 20

    redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # Optional: docker compose --profile object-store up -d
  minio:
    profiles: ["object-store"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - firmos_minio:/data

volumes:
  legal_pg:
  firmos_minio:
