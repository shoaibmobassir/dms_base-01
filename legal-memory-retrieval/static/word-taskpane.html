<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirmOS — Microsoft Word Assistant</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090A0C;
      --card: #121418;
      --border: #23272F;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --danger: #EF4444;
      --success: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #1E293B;
      color: #93C5FD;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 7px 4px;
      background: #161920;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #FFF; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #1F242E; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #2A303C; }
    .input-box {
      width: 100%;
      background: #14171E;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    textarea.input-box { resize: vertical; min-height: 80px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .result-box {
      font-size: 12px;
      background: #0E1015;
      border: 1px solid #1E232D;
      border-radius: 6px;
      padding: 10px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
    }
    .action-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚖️ FirmOS</span>
      <span class="badge">Word Add-in</span>
    </div>
    <span id="authStatus" style="font-size: 11px; color: #10B981;">● Connected</span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('analyze')">Selection</button>
    <button class="tab-btn" onclick="switchTab('draft')">Draft Clause</button>
    <button class="tab-btn" onclick="switchTab('search')">Firm Memory</button>
  </div>

  <!-- Tab 1: Analyze Selection -->
  <div id="tab-analyze" class="panel active">
    <button class="btn btn-secondary" onclick="readSelectionAndAnalyze('redline')">🔍 Redline Selected Clause</button>
    <div style="height: 8px;"></div>
    <button class="btn btn-secondary" onclick="readSelectionAndAnalyze('explain')">💡 Explain / Risk Check</button>

    <div id="analyzeResultCard" class="card" style="display: none;">
      <div style="font-weight: 600; margin-bottom: 6px;" id="analyzeTitle">Analysis Result</div>
      <div id="analyzeContent" class="result-box"></div>
      <div class="action-group">
        <button class="btn btn-primary" onclick="insertProposedText()">Insert into Document</button>
      </div>
    </div>
  </div>

  <!-- Tab 2: Draft Clause -->
  <div id="tab-draft" class="panel">
    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">Instruction for Drafting</label>
    <textarea id="draftInstruction" class="input-box" placeholder="e.g. Draft an aggressive limitation of liability clause capped at 12 months fees..."></textarea>
    <button class="btn btn-primary" onclick="draftNewClause()">✍️ Draft Clause</button>

    <div id="draftResultCard" class="card" style="display: none;">
      <div style="font-weight: 600; margin-bottom: 6px;">Drafted Clause</div>
      <div id="draftContent" class="result-box"></div>
      <div class="action-group">
        <button class="btn btn-primary" onclick="insertDraftedClause()">Insert at Cursor</button>
      </div>
    </div>
  </div>

  <!-- Tab 3: Search Firm Memory -->
  <div id="tab-search" class="panel">
    <input id="searchQuery" type="text" class="input-box" placeholder="Search precedents, clauses, arguments...">
    <button class="btn btn-primary" onclick="searchFirmMemory()">Search Memory</button>
    <div id="searchResults" style="margin-top: 12px;"></div>
  </div>

  <script>
    let proposedTextToInsert = "";

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    async function readSelectionAndAnalyze(action) {
      if (typeof Word === 'undefined') {
        // Mock fallback for browser preview
        runAnalysis("Customer shall indemnify and hold harmless Vendor against all liabilities.", action);
        return;
      }
      Word.run(async (context) => {
        const selection = context.document.getSelection();
        selection.load("text");
        await context.sync();
        const text = selection.text;
        if (!text || !text.trim()) {
          alert("Please select some text in Microsoft Word first.");
          return;
        }
        await runAnalysis(text, action);
      });
    }

    async function runAnalysis(text, action) {
      const card = document.getElementById('analyzeResultCard');
      const content = document.getElementById('analyzeContent');
      card.style.display = 'block';
      content.textContent = "Analyzing against firm precedents...";

      try {
        const res = await fetch('/api/word/analyze-selection', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selection_text: text, action: action })
        });
        const data = await res.json();
        if (action === 'redline') {
          proposedTextToInsert = data.proposed_text || "";
          content.textContent = `[Risk: ${data.risk_severity.toUpperCase()}]\n\nRationale:\n${data.rationale}\n\nProposed Counter-Language:\n${data.proposed_text}`;
        } else {
          proposedTextToInsert = "";
          content.textContent = data.analysis;
        }
      } catch (err) {
        content.textContent = "Error communicating with FirmOS: " + err.message;
      }
    }

    function insertProposedText() {
      if (!proposedTextToInsert) return;
      if (typeof Word === 'undefined') {
        alert("Inserted into Word: " + proposedTextToInsert);
        return;
      }
      Word.run(async (context) => {
        const selection = context.document.getSelection();
        selection.insertText(proposedTextToInsert, Word.InsertLocation.replace);
        await context.sync();
      });
    }

    async function draftNewClause() {
      const instruction = document.getElementById('draftInstruction').value;
      if (!instruction.trim()) return;

      const card = document.getElementById('draftResultCard');
      const content = document.getElementById('draftContent');
      card.style.display = 'block';
      content.textContent = "Drafting clause using firm knowledge...";

      try {
        const res = await fetch('/api/word/draft-clause', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instruction: instruction, clause_type: "General" })
        });
        const data = await res.json();
        proposedTextToInsert = data.clause_text;
        content.textContent = data.clause_text;
      } catch (err) {
        content.textContent = "Drafting error: " + err.message;
      }
    }

    function insertDraftedClause() {
      insertProposedText();
    }

    async function searchFirmMemory() {
      const q = document.getElementById('searchQuery').value;
      const resBox = document.getElementById('searchResults');
      if (!q.trim()) return;
      resBox.innerHTML = "<div style='color: #9CA3AF;'>Searching...</div>";
      try {
        const res = await fetch('/api/retrieval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, k: 3 })
        });
        const data = await res.json();
        let html = '';
        (data.hits || []).forEach(h => {
          html += `<div class="card" style="margin-bottom: 8px;">
            <div style="font-weight: 600; font-size: 11px; color: #60A5FA;">${h.doc_id} — ${h.title || ''}</div>
            <div style="font-size: 11px; margin-top: 4px;">${h.snippet}</div>
          </div>`;
        });
        resBox.innerHTML = html || "<div style='color: #9CA3AF;'>No hits found.</div>";
      } catch (err) {
        resBox.innerHTML = "<div style='color: #EF4444;'>Error: " + err.message + "</div>";
      }
    }
  </script>
</body>
</html>
