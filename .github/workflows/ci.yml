name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: legal-memory-retrieval

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_memory
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U legal -d legal_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    env:
      DATABASE_URL: postgresql://legal:legal@localhost:55432/legal_memory
      REDIS_URL: redis://localhost:6380
      AUTH_ENABLED: "false"
      RERANK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legal-memory-retrieval/requirements.txt
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Schema + CI fixture
        run: |
          python scripts/migrate.py
          python scripts/seed_ci_minimal.py
          python scripts/seed_demo.py --anchor 2026-09-24
      - name: Production contract suite
        # Full retrieval evals need the ingested corpus + embeddings; CI gates the
        # production surface (auth, ACL, SPA contract, health).
        run: >
          python -m pytest -q --tb=line
          tests/test_health.py
          tests/test_security.py
          tests/test_ui_contract.py
          tests/test_chat_assistant.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-memory-retrieval/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legal-memory-retrieval/frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx tsc --noEmit
      - run: npm run build
