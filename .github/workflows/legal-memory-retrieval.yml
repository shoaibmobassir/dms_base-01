name: legal-memory-retrieval

on:
  push:
    paths: ["legal-memory-retrieval/**", "dummy-firm/data/**", ".github/workflows/legal-memory-retrieval.yml"]
  pull_request:
    paths: ["legal-memory-retrieval/**", "dummy-firm/data/**", ".github/workflows/legal-memory-retrieval.yml"]

defaults:
  run:
    working-directory: legal-memory-retrieval

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_memory
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal -d legal_memory"
          --health-interval 3s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      DATABASE_URL: postgresql://legal:legal@localhost:55432/legal_memory
      REDIS_URL: redis://localhost:6380
      AUTH_ENABLED: "false"
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legal-memory-retrieval/requirements.txt
      - name: Install Python deps (CPU torch)
        run: |
          python -m venv .venv
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -r requirements.txt pytest

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1

      - name: Load corpus, embed, migrate, seed
        run: |
          .venv/bin/python scripts/ingest.py
          .venv/bin/python scripts/embed.py
          .venv/bin/python scripts/migrate.py
          .venv/bin/python scripts/seed_demo.py

      - name: Backend tests
        run: .venv/bin/python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legal-memory-retrieval/frontend/package-lock.json
      - name: Build SPA
        working-directory: legal-memory-retrieval/frontend
        run: npm ci && npm run build
      - name: Browser tests (seeded DB)
        working-directory: legal-memory-retrieval/frontend
        env:
          CI: "true"
          E2E_BROWSER_CHANNEL: chromium
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: legal-memory-retrieval/frontend/test-results
